<body>
    <!-- variable : to store value in single variable name -->


<script>
    //  <!-- 1)var -->

        var a = 10;  declaration allow
        var a = 20;  re-declaration allow

        console.log(a)

    // <!-- 2)let -->

        let b = 20;   declaratio allow
        // let b = 30;  re-declaration not allow

    console.log(b)

    // <!-- 3)const -->

        const c = 20;  declaration allow
        // const c = 40;  re-declaration not allow
        // c = 50;    re-assign not allow

        console.log(c)


</script>
