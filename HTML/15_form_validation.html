<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- [A-Za-z] -->

     <table align="center">
        <caption>form data</caption>
        <form action="">
            <tr>
                <td><label for="">Enter your name</label></td>
                <!-- <td><input type="text" placeholder="Enter name" required pattern="[A-za-z]+" name="" value=""></td> -->
                 <td><input type="text" placeholder="Enter name" required pattern="[A-za-z]{3,8}" name="" value=""></td>
            </tr>
            <tr>
                <td><label for="">Enter your Surname</label></td>
                <td><input type="text" placeholder="Enter your surname" pattern="[A-za-z]{3,8}" required></td>
            </tr>
            <tr>
                <!-- shubhamjadav.tops@gmail.com -->
                <!--  -->
                <!-- Shubhamjadav12@gmail.com -->
                 <!-- [a-z0-9]+@+[a-z]+.+[a-z]{2,3}$ -->
                <td><label for="">Enter your Email</label></td>
                <td><input type="email" placeholder="Enter your Email" required></td>
            </tr>
            <tr>
                <td><label for="">Enter your number</label></td>
                <td><input type="tel" placeholder="Enter your phone" pattern="[6789][0-9]{9}" maxlength="10" required></td>
            </tr>
            <tr>
                <td><label for="">Enter your password</label></td>
                <!--  -->
                <td><input type="password" placeholder="Enter your password" pattern="[A-Z][A-Za-z0-9]{7,12}" required></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="number" required min="1" max="6"></td>
                <!-- <td></td> -->
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit"></td>
            </tr>
        </form>
    </table>
</body>
</html>
