<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav {
            background-color: lightcoral;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list li{
            display: inline-block;      
        }
        .sec1{
            background-color: aqua;
            display: flex;
        }
        .box{
            height:300px;
            width: 25%;
            border: 2px solid;
        }
        .sec2{
            background-color: lawngreen;
            display: flex;
        }
        .box1{
            height: 300px;
            width: 33.33%;
            border: 2px solid;
        }
        #box{
            display: flex;
            flex-direction: column;
        }

        .top,.bottom{
            height: 50%;
            width: 100%;
            border: 2px solid green;
        }
        .left,.right{
            width: 50%;
            height: 100%;
            border: 2px solid brown;
        }
        #box1{
            display: flex;
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">logo</div>
        <ul class="list">
            <li>Home</li>
            <li>About</li>
            <li>contact</li>
            <li>help</li>
        </ul>
        <div class="icon">serach-icon</div>
    </nav>

    <section class="sec1">
        <div class="box">1</div>
        <div class="box" id="box">
            <div class="top">top</div>
            <div class="bottom">bottom</div>
        </div>
        <div class="box" id="box1">
            <div class="left">left</div>
            <div class="right">right</div>
        </div>
        <div class="box">4</div>
    </section>

    <section class="sec2">
        <div class="box1">1</div>
        <div class="box1">2</div>
        <div class="box1">3</div>
    </section>
</body>

</html>
