<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            height: 200px;
            width: 200px;
            border: 2px solid;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            /* animation: xy 3s infinite; */
            animation: dark 6s infinite;
        }

        @keyframes xy {
            from {
                background-color: lightcoral;
            }

            to {
                border-radius: 50%;
                background-color: green;
            }
        }

        @keyframes dark {
            0% {
                background: red;
            }

            25% {
                background: green;
                border-radius: 40px;
            }

            50% {
                background: blue;
                border-radius: 0px;
                   transform: translate(100px, 100px);
            }

            75% {
                background: linear-gradient(red, green, blue);
           
                  transform: scale(1.2);
            }

            100% {
                background: lightcoral;
            }
        }
    </style>
</head>

<body>
    <div class="main">

    </div>
</body>

</html>
